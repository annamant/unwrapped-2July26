<style>
  :root { --bg:#FAFAF8; --fg:#141210; --border:#E0DFD9; --muted:#7A7A7A; --accent:#E8341C; --panel:#fff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: "DM Sans", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--fg); }
  #app { display:grid; grid-template-columns: 340px 1fr; height:100%; }
  aside { border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0; background:var(--panel); }
  header { padding:16px 16px 12px; border-bottom:1px solid var(--border); }
  header h1 { margin:0 0 4px; font-family: Georgia, serif; font-size:20px; font-weight:700; }
  header p { margin:0; font-size:12px; color:var(--muted); line-height:1.45; }
  .stats { display:flex; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); }
  .stats strong { color:var(--fg); font-size:16px; display:block; font-family: ui-monospace, monospace; }
  .filters { padding:10px 16px; border-bottom:1px solid var(--border); max-height:160px; overflow:auto; }
  .filters label { display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0; cursor:pointer; }
  .list { flex:1; overflow:auto; }
  .item { display:grid; grid-template-columns: 22px 1fr; gap:8px; padding:10px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
  .item:hover, .item.active { background:#F5F4F0; }
  .item.selected { background:#FFF5F3; }
  .item .name { font-size:13px; font-weight:600; }
  .item .meta { font-size:11px; color:var(--muted); margin-top:2px; line-height:1.35; }
  .item .web { font-size:11px; color:var(--fg); margin-top:2px; word-break:break-all; }
  .noweb { color:#b45309; }
  footer { padding:12px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  button { font-family: ui-monospace, monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; padding:10px 12px; border:1px solid var(--fg); background:var(--fg); color:var(--bg); cursor:pointer; }
  button.secondary { background:var(--bg); color:var(--fg); }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  #map { height:100%; width:100%; }
  .leaflet-popup-content { font-size:13px; line-height:1.4; margin:10px 12px; }
  .leaflet-popup-content button { margin-top:8px; width:100%; }
  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    aside { border-right:none; border-bottom:1px solid var(--border); }
  }
</style>
</head>

<div id="app">

  </aside>
  <div id="map"></div>
</div>

const selected = new Set();
const corridorOn = {};
PLACES.forEach(p => { corridorOn[p.corridor] = true; });

const map = L.map('map').setView([51.46, -0.11], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const colors = {};
const palette = ['#E8341C','#141210','#2563eb','#15803d','#a16207','#7c3aed','#0f766e','#be123c','#1d4ed8','#b45309','#334155','#047857','#9333ea'];
Object.keys(corridorOn).sort().forEach((c,i) => { colors[c] = palette[i % palette.length]; });

const markers = {};
const layer = L.layerGroup().addTo(map);

function visiblePlaces() {
  return PLACES.filter(p => corridorOn[p.corridor]);
}

function syncStats() {
  const vis = visiblePlaces();
  document.getElementById('nVisible').textContent = vis.length;
  document.getElementById('nSelected').textContent = selected.size;
  document.getElementById('nWithWeb').textContent = [...selected].filter(i => PLACES[i].website).length;
  document.getElementById('exportBtn').disabled = selected.size === 0;
}

function renderFilters() {
  const el = document.getElementById('filters');
  const counts = {};
  PLACES.forEach(p => { counts[p.corridor] = (counts[p.corridor]||0)+1; });
  el.innerHTML = Object.keys(counts).sort().map(c => `
    <label>
      <input type="checkbox" data-c="${c.replace(/"/g,'&quot;')}" ${corridorOn[c]?'checked':''} />
      <span style="display:inline-block;width:8px;height:8px;background:${colors[c]};margin-right:4px;"></span>
      ${c} <span style="color:var(--muted)">(${counts[c]})</span>
    </label>`).join('');
  el.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      corridorOn[inp.dataset.c] = inp.checked;
      render();
    });
  });
}

function popupHtml(p, idx) {
  const web = p.website ? `<div><a href="${p.website}" target="_blank" rel="noreferrer">${p.website}</a></div>` : '<div class="noweb">No website</div>';
  const sel = selected.has(idx);
  return `<strong>${p.name}</strong><br/>${p.type || ''}<br/>${p.address}<br/>${p.postcode}<br/>${web}
    <button onclick="toggleSelect(${idx})">${sel ? 'Deselect' : 'Select for email'}</button>`;
}

function renderMarkers() {
  layer.clearLayers();
  visiblePlaces().forEach(p => {
    const idx = PLACES.indexOf(p);
    const m = L.circleMarker([p.lat, p.lng], {
      radius: selected.has(idx) ? 9 : 6,
      color: selected.has(idx) ? '#E8341C' : colors[p.corridor],
      weight: selected.has(idx) ? 2 : 1,
      fillColor: selected.has(idx) ? '#E8341C' : colors[p.corridor],
      fillOpacity: selected.has(idx) ? 0.95 : 0.75,
    });
    m.bindPopup(() => popupHtml(p, idx));
    m.on('click', () => {
      document.querySelectorAll('.item').forEach(n => n.classList.remove('active'));
      const row = document.querySelector(`.item[data-i="${idx}"]`);
      if (row) { row.classList.add('active'); row.scrollIntoView({block:'nearest'}); }
    });
    m.addTo(layer);
    markers[idx] = m;
  });
}

function renderList() {
  const el = document.getElementById('list');
  const vis = visiblePlaces().sort((a,b) => a.corridor.localeCompare(b.corridor) || a.name.localeCompare(b.name));
  el.innerHTML = vis.map(p => {
    const idx = PLACES.indexOf(p);
    const web = p.website
      ? `<div class="web">${p.website}</div>`
      : `<div class="meta noweb">No website — skip for email scrape</div>`;
    return `<div class="item ${selected.has(idx)?'selected':''}" data-i="${idx}">
      <input type="checkbox" ${selected.has(idx)?'checked':''} ${p.website?'':'disabled'} />
      <div>
        <div class="name">${p.name}</div>
        <div class="meta">${p.corridor} · ${p.postcode} · ${p.type || '—'}</div>
        ${web}
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.item').forEach(row => {
    const idx = +row.dataset.i;
    const cb = row.querySelector('input');
    const go = () => {
      map.setView([PLACES[idx].lat, PLACES[idx].lng], 16);
      if (markers[idx]) markers[idx].openPopup();
    };
    row.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      go();
    });
    cb.addEventListener('change', () => {
      if (cb.checked) selected.add(idx); else selected.delete(idx);
      render();
    });
  });
}

window.toggleSelect = function(idx) {
  if (!PLACES[idx].website) { alert('No website — cannot email-scrape'); return; }
  if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
  render();
  if (markers[idx]) markers[idx].openPopup();
};

function render() {
  renderFilters();
  renderMarkers();
  renderList();
  syncStats();
}

document.getElementById('clearBtn').onclick = () => { selected.clear(); render(); };
document.getElementById('selectWebBtn').onclick = () => {
  visiblePlaces().forEach(p => { if (p.website) selected.add(PLACES.indexOf(p)); });
  render();
};
document.getElementById('exportBtn').onclick = () => {
  const rows = [...selected].map(i => PLACES[i]).filter(p => p.website);
  const header = ['name','website','type','city','address','postcode','district','corridor'];
  const esc = (v) => `"${String(v||'').replace(/"/g,'""')}"`;
  const csv = [header.join(',')].concat(rows.map(r => header.map(h => esc(r[h])).join(','))).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lambeth_apparel_selected_for_email.csv';
  a.click();
};

render();
const bounds = L.latLngBounds(PLACES.map(p => [p.lat, p.lng]));
map.fitBounds(bounds.pad(0.08));
</script>

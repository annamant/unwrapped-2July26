<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unwrapped — see it, claim it, collect it on your high street</title>
    <meta name="description" content="Unwrapped: look into your high street from anywhere — see what's ready in a photo or short video, claim in the app, collect at the counter. Not mystery bags — local shopping you can see." />
    <meta name="theme-color" content="#FFF4EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://shopunwrapped.com/" />
    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unwrapped" />
    <meta property="og:title" content="Unwrapped — see it, claim it, collect it on your high street" />
    <meta property="og:description" content="Look into shops nearby from the sofa or the bus. See the real thing, pay in the app, collect with a QR. Local shopping you can see — not mystery bags." />
    <meta property="og:url" content="https://shopunwrapped.com" />
    <meta property="og:image" content="https://shopunwrapped.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --vermillion: #FF2D12;
        --vermillion-deep: #9E1C0E;
        --vermillion-rich: #C92210;
        --ink: #3A1610;
        --cream: #FFF8F4;
        --bg: #FFF4EF;
        --muted: #FFE3D7;
        --muted-fg: #8A564A;
        --border: #F3C9BC;
        --black: #9E1C0E;
        --white: #FFF8F4;
        --grey: #8A564A;
        --light: #FFE3D7;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background: var(--bg);
        background-image:
          radial-gradient(ellipse 90% 60% at 10% -10%, rgba(255,90,60,0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 95% 15%, rgba(255,45,18,0.12), transparent 50%),
          linear-gradient(165deg, #FFF8F4 0%, #FFE8DE 45%, #FFF1EA 100%);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; }
      img, svg, video, canvas { max-width: 100%; height: auto; }
      /* Prevent iOS Safari auto-zoom on input focus: fields must be >= 16px on small screens */
      @media (max-width: 640px) {
        input, select, textarea { font-size: 16px !important; }
        button, a { -webkit-tap-highlight-color: transparent; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

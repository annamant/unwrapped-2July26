        <h1>Unwrapped lets you know when a shop you already know has something on.</h1>
        <p>Notify me</p>
        <p>It connects you with the local shops you already like.</p>
        <p>A bakery, a florist, a bookshop, a barber, a deli.</p>
        <p>Sign up and we'll tell you when a shop you know has something on.</p>
        <p>Tell your regulars when you've got something on.</p>
        <h2>Hear from the shops you already like, only when something's worth the trip.</h2>
        <ul>
          <li>The shop comes to you, so there's nothing to browse or hunt for.</li>
          <li>Book it and it's yours before it sells out.</li>
          <li>Collect it in store.</li>
        </ul>
        <p>Like Whatnot or Vinted, but local: no courier, you collect in store.</p>
        <h2>Tell your regulars when you've got something on, and they come through the door.</h2>
        <ul>
          <li>Post one photo or short video and a line. No content job, no followers to build.</li>
          <li>Customers pay before they arrive, so no-shows don't cost you.</li>
          <li>You choose what and how many, so you never have to discount your brand.</li>
          <li>Free to join.</li>
        </ul>

        <h1>Your high street, live.</h1>
        <p>London · Opening soon</p>
        <p>Shops post video and images of what's just landed — fresh stock, one-off pieces, last-hour deals. Claim it, pay in the app, collect in person.</p>
        <h2>See it. Claim it. Collect it.</h2>
        <p>A bakery posts the loaf that just came out. A boutique shows the jacket on the rail. You see the actual item in a photo or video, claim it before someone else does, and walk in to collect it — no guessing, no waiting for delivery.</p>
